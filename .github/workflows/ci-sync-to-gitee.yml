# 同步代码到 Gitee
# 参考: https://yikun.github.io/2020/01/17/%E5%B7%A7%E7%94%A8Github-Action%E5%90%8C%E6%AD%A5%E4%BB%A3%E7%A0%81%E5%88%B0Gitee/
# Github地址：https://github.com/Yikun/hub-mirror-action?tab=readme-ov-file#faq
name: Sync-to-Gitee

on:
  push:
    branches:
      - dev
      - dev-vuepress
      - main
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync to Gitee
        uses: Yikun/hub-mirror-action@master
        with:
          # GitHub 用户名
          src: github/dazer007
          # Gitee 用户名
          dst: gitee/dazer007
          # 需要同步的仓库列表（逗号分隔）
          static_list: "dazer007.github.io"
          # 使用 HTTPS 方式推送（避免 SSH 密钥格式问题）
          clone_style: "https"
          # Gitee Token: https://gitee.com/profile/personal_access_tokens
          dst_token: ${{ secrets.GITEE_TOKEN }}
          # 强制更新
          force_update: true
          dst_key: ''